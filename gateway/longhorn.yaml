apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: longhorn-gw
  namespace: longhorn-system
spec:
  gatewayClassName: traefik
  listeners:
  - protocol: HTTP
    port: 80
    name: web
    allowedRoutes:
        namespaces:
          from: Same

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-route
  namespace: longhorn-system

spec:

  parentRefs:
  - name: longhorn-gw

  hostnames:
    - longhorn.kube.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: longhorn-frontend
          port: 80
