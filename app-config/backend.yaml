apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mates-app
  labels:
    service: backend
spec:
  ports:
    - port: 8000
  selector:
    service: backend

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mates-app
  labels:
    service: backend
spec:
  replicas: 2
  selector: 
    matchLabels: 
      service: backend
  template:
    metadata:
      labels:
        service: backend
    spec:
      imagePulSecrets:
        - name: dockerhub-secret
      containers:
      - name: backend
        image: 3omar0/mates:v0.1.0
        ports:
        - containerPort: 8000
        env:
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: secret_key

          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: postgres_db

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: postgres_user

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: postgres_password

          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: db_host

          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                  name: users-secret
                  key: db_port