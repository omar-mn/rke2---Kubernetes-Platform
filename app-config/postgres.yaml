apiVersion: v1
kind: Service
metadata:
  name: postgres-users-svc
  namespace: mates-app
  labels:
    service: users-db
spec:
  ports:
    - port: 5432
  selector:
    service: users-db

---

apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres-users-dep
  labels:
    service: users-db
spec:
  replicas: 1
  selector:
    matchLabels: 
      service: users-db
  template:
    metadata:
      labels:
        service: users-db
    spec:
      containers:
      - name: postgres-db
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
                name: users-secret
                key: postgres_db

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
                name: users-secret
                key: postgres_user

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
                name: users-secret
                key: postgres_password

        ports:
        - containerPort: 5432