
name: backend-ci-prod
on:
  push:
    tags:
      - 'v*'
    paths:
      - "backend/src/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

    env:
      SECRET_KEY: test-secret-key
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: cheackout
        uses: actions/checkout@v4.2.2

      - name: reqs install
        run:  pip install -r backend/requirements/requirements.dev.txt

      - name: run tests
        run: cd backend/src/ && pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend/.
          push: true
          tags: 3omar0/mates:${{ env.IMAGE_TAG }}


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: omar-mn/mates-config
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Update image
        run: |
          sed -i "s/mates:v.*/mates:${{ env.IMAGE_TAG }}/" backend.yaml

      - name: Commit and push
        run: |
          git config user.name "ghost"
          git config user.email "ghost@null"
          git add .
          git commit -m "Update backend image to ${{ env.IMAGE_TAG }}"
          git push