
name: front-ci-prod
on:
  push:
    tags:
      - 'v*'
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/.
          push: true
          tags: 3omar0/mates-front:${{ env.IMAGE_TAG }}


  deploy:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: omar-mn/mates-config
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
  
      - name: Update image
        run: |
          sed -i "s/mates-front:v.*/mates-front:${{ env.IMAGE_TAG }}/" frontend.yaml
  
      - name: Commit and push
        run: |
          git config user.name "ghost"
          git config user.email "ghost@null"
          git add .
          git commit -m "Update frontend image to ${{ env.IMAGE_TAG }}"
          git push